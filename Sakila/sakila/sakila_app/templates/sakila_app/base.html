{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sakila Movie Rental System - Browse and rent from our collection of 1,000+ films including Action, Comedy, Drama, and more.">
    <meta name="keywords" content="movies, films, rental, sakila, dvd, bluray, cinema">
    <meta name="author" content="Sakila Movie Rental">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sakila.example.com{% block og_url %}{% endblock %}">
    <meta property="og:title" content="{% block og_title %}Sakila Movie Rental{% endblock %}">
    <meta property="og:description" content="Browse and rent from our collection of 1,000+ films">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="{% block twitter_title %}Sakila Movie Rental{% endblock %}">
    <meta property="twitter:description" content="Browse and rent from our collection of 1,000+ films">
    
    <title>{% block title %}Sakila Movie Rental{% endblock title %}</title>
    <link rel="stylesheet" href="{% static 'sakila_app/css/main.css' %}">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="navbar-brand">
                <a href="/">Sakila</a>
            </div>
            <ul class="navbar-nav">
                <li><a href="/films/">Films</a></li>
                <li><a href="/actors/">Actors</a></li>
                <li><a href="/categories/">Categories</a></li>
                <li><a href="/api/films/">API</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock content %}
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Sakila Movie Rental System. All rights reserved.</p>
        </div>
    </footer>

    {% block scripts %}{% endblock scripts %}
</body>
</html>
