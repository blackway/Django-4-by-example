<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Films - Sakila</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1><a href="index.html">Sakila</a></h1>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="films.html" class="active">Films</a></li>
                <li><a href="actors.html">Actors</a></li>
                <li><a href="categories.html">Categories</a></li>
                <li><a href="customers.html">Customers</a></li>
                <li><a href="rentals.html">Rentals</a></li>
                <li><a href="stores.html">Stores</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <!-- Page Header -->
            <section class="page-header">
                <h1>Film Catalog</h1>
                <p>Browse our complete collection of films</p>
            </section>

            <!-- Filters -->
            <section class="filters-section">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search films...">
                    <button id="searchBtn">Search</button>
                </div>
                <div class="filter-group">
                    <label for="categoryFilter">Category:</label>
                    <select id="categoryFilter">
                        <option value="">All Categories</option>
                        <option value="Action">Action</option>
                        <option value="Animation">Animation</option>
                        <option value="Comedy">Comedy</option>
                        <option value="Drama">Drama</option>
                        <option value="Horror">Horror</option>
                        <option value="Sci-Fi">Sci-Fi</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="ratingFilter">Rating:</label>
                    <select id="ratingFilter">
                        <option value="">All Ratings</option>
                        <option value="G">G</option>
                        <option value="PG">PG</option>
                        <option value="PG-13">PG-13</option>
                        <option value="R">R</option>
                        <option value="NC-17">NC-17</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="sortBy">Sort by:</label>
                    <select id="sortBy">
                        <option value="title">Title</option>
                        <option value="release_year">Release Year</option>
                        <option value="rental_rate">Rental Rate</option>
                        <option value="length">Length</option>
                    </select>
                </div>
            </section>

            <!-- Results Info -->
            <section class="results-info">
                <p id="resultsCount">Showing 1-20 of 1000 films</p>
            </section>

            <!-- Film Grid -->
            <section class="film-grid" id="filmGrid">
                <!-- Films will be loaded dynamically -->
            </section>

            <!-- Pagination -->
            <section class="pagination" id="pagination">
                <button class="pagination-btn" id="prevBtn" disabled>Previous</button>
                <div class="pagination-numbers" id="paginationNumbers"></div>
                <button class="pagination-btn" id="nextBtn">Next</button>
            </section>
        </div>
    </main>

    <!-- Film Detail Modal -->
    <div id="filmModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="filmModalContent"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Sakila Movie Rental System. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/films.js"></script>
</body>
</html>
